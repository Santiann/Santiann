name: Update projects

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_projects.py"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar a seção Projects do README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          GH_TOPIC: portfolio
        run: python scripts/update_projects.py

      - name: Commitar se houve mudança
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "Sem alterações no README."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualiza seção Projects"
          git push
